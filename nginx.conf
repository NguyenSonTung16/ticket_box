events {
    worker_connections 1024;
}

http {
    # Cấu hình Rate Limiting: 10MB bộ nhớ cho biến $binary_remote_addr, giới hạn 15 req/s trên mỗi IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    
    # Cấu hình Connection Limiting: giới hạn tối đa 10 kết nối đồng thời trên mỗi IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Cấu hình giới hạn kết nối riêng cho SSE (tối đa 5 đường ống/IP để chống spam tab)
    limit_conn_zone $binary_remote_addr zone=sse_limit:10m;

    # Logging format để dễ debug
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" -> $upstream_addr';
    access_log /var/log/nginx/access.log main;

    # Định nghĩa các Upstream (Máy chủ Backend)
    upstream auth_server {
        server host.docker.internal:3001;
    }
    upstream booking_cluster {
        least_conn;
        server host.docker.internal:3002;
        server host.docker.internal:3012;
        server host.docker.internal:3022;
    }
    upstream info_cluster {
        server host.docker.internal:3003;
    }
    
    upstream payment_server {
        server host.docker.internal:3004;
    }
    
    upstream worker_server {
        server host.docker.internal:3005;
    }

    upstream event_server {
        server host.docker.internal:3005;
    }

    upstream ai_server {
        server host.docker.internal:3008;
    }

    # Guest / VIP Import Service (PORT=3006)
    upstream guest_server {
        server host.docker.internal:3006;
    }

    # Cluster Booking với Thuật toán Least Connections và Active Health Check
    upstream booking_servers {
        least_conn; # Luôn chọn cổng đang có ít người dùng nhất
        
        # max_fails=3: Thử 3 lần lỗi
        # fail_timeout=10s: Cấm cửa 10 giây nếu chết
        server host.docker.internal:3002 max_fails=3 fail_timeout=10s;
        server host.docker.internal:3012 max_fails=3 fail_timeout=10s;
        server host.docker.internal:3022 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        # Route tới Auth Service
        location /auth/ {
            proxy_pass http://auth_server/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            
            proxy_intercept_errors on;
            error_page 502 504 = @json_error_auth;
        }

        # Route tới Info Service
        location /info/ {
            proxy_pass http://info_cluster/info/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_intercept_errors on;
            error_page 502 504 = @json_error_info;
        }

        # Route tới Guest Service (VIP import, admin imports) — PHẢI đặt trước /api/ chung
        location /api/admin/ {
            proxy_pass http://guest_server/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_intercept_errors on;
            error_page 502 504 = @json_error_guest;
        }

        # Route tới Event Service (các route /api/v1/events/... khác)
        location /api/ {
            proxy_pass http://event_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_intercept_errors on;
            error_page 502 504 = @json_error_event;
        }

        # Route tới AI / Artist Service
        location /artist/ {
            proxy_pass http://ai_server/artist/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_intercept_errors on;
            error_page 502 504 = @json_error_ai;
        }

        # Route tới Payment Service
        location /payment/ {
            proxy_pass http://payment_server/payment/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_intercept_errors on;
            error_page 502 504 = @json_error;
        }

        # Route tới Worker Service
        location /worker/ {
            proxy_pass http://worker_server/worker/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location @json_error {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' '*';
            return 502 '{"success": false, "message": "Cổng thanh toán đang bảo trì", "code": 502}';
        }

        location @json_error_auth {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' '*';
            return 502 '{"success": false, "message": "Hệ thống đăng nhập đang bảo trì. Bạn có thể xem thông tin nhưng chưa thể đăng nhập lúc này.", "code": 502}';
        }

        location @json_error_info {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' '*';
            return 502 '{"success": false, "message": "Hệ thống tải dữ liệu sự kiện đang nâng cấp. Vui lòng quay lại sau ít phút.", "code": 502}';
        }

        location @json_error_event {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' '*';
            return 502 '{"success": false, "message": "Hệ thống quản lý sự kiện đang bảo trì.", "code": 502}';
        }

        location @json_error_guest {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' '*';
            return 502 '{"success": false, "message": "Hệ thống import khách mời đang bảo trì.", "code": 502}';
        }

        location @json_error_ai {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' '*';
            return 502 '{"success": false, "message": "Hệ thống AI đang bảo trì. Vui lòng quay lại sau.", "code": 502}';
        }

        location @json_error_booking {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' '*';
            return 502 '{"success": false, "message": "Hệ thống đặt vé đang quá tải hoặc bảo trì. Vui lòng thử lại sau.", "code": 502}';
        }

        # Route tới Booking Service Cluster (Load Balancing & SSE)
        location /booking/ {
            proxy_pass http://booking_servers/booking/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 502 504 = @json_error_booking;
        }

        # ── MinIO Object Storage proxy ──────────────────────────────────────
        # All browser presigned-PUT/GET traffic goes through here.
        location /minio/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Amz-Date,X-Amz-Signature,X-Amz-Algorithm,X-Amz-Credential,X-Amz-SignedHeaders,x-amz-checksum-crc32,x-amz-sdk-checksum-algorithm,x-amz-content-sha256' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            proxy_pass              http://host.docker.internal:9000/;
            # MinIO requires the exact Host header that was signed by AWS SDK
            proxy_set_header        Host localhost:9000;
            client_max_body_size    0;            # no Nginx limit — MinIO enforces via presigned params
            proxy_request_buffering off;          # stream directly, never buffer in memory
            proxy_read_timeout      600s;         # allow up to 500 MB CSV at ~1 MB/s
            proxy_send_timeout      600s;
        }

        # SSE requires special headers to keep connection open
        location /booking/sse/ {
            proxy_pass http://booking_servers;
            
            # Giới hạn kết nối từ nhánh HA Testing
            limit_conn sse_limit 5;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }
    }
}

events {
    worker_connections 1024;
}

http {
    # Cấu hình Rate Limiting: 10MB bộ nhớ cho biến $binary_remote_addr, giới hạn 15 req/s trên mỗi IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    
    # Cấu hình Connection Limiting: giới hạn tối đa 10 kết nối đồng thời trên mỗi IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Cấu hình giới hạn kết nối riêng cho SSE (tối đa 5 đường ống/IP để chống spam tab)
    limit_conn_zone $binary_remote_addr zone=sse_limit:10m;

    upstream auth_cluster {
        server host.docker.internal:3001;
    }
    upstream booking_cluster {
        least_conn;
        server host.docker.internal:3002;
        server host.docker.internal:3012;
        server host.docker.internal:3022;
    }
    upstream info_cluster {
        server host.docker.internal:3003;
    }
    upstream payment_cluster {
        server host.docker.internal:3004;
    }

    server {
        listen 80;

        location /auth/ {
            proxy_pass http://auth_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /booking/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://booking_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /info/ {
            proxy_pass http://info_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /search/ {
            proxy_pass http://info_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /payment/ {
            proxy_pass http://payment_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Fallback for root (Frontend served from info-service or any)
        location / {
            proxy_pass http://info_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SSE requires special headers to keep connection open
        location /booking/sse/ {
            limit_conn sse_limit 5;
            proxy_pass http://booking_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
